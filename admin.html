<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — URL Switcher</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
/* Admin-only visual refresh; original global stylesheet stays unchanged. */
:root{--primary:#3457cf;--primary-hover:#2548ba;--border:#e4e9f4;--muted:#72809a;--surface:#fff;--shadow:0 18px 48px rgba(35,53,94,.07)}
body{background:radial-gradient(circle at 12% 0%,#e3ebff 0,transparent 35%),linear-gradient(180deg,#f7f9fd,#eef2f9);color:#172341}
.shell.wide{max-width:1190px;margin:30px auto;padding:24px}
.top{padding:12px 6px 22px;align-items:center}
.top h1{font-size:clamp(28px,3vw,39px);font-weight:850;letter-spacing:-.04em;margin:7px 0}
.eyebrow{color:#5d6ed3;letter-spacing:.18em}
.top a{color:#3557bd;text-decoration:none;font-weight:700}
.card{border-radius:22px;padding:30px;border:1px solid #e6eaf3;box-shadow:var(--shadow);margin:20px 0}
.card h2{font-size:20px;margin-bottom:20px}
.toolbar{padding:0 8px 4px}
label{color:#2a3652;font-weight:700}
input,select{border:1px solid #d9e1ef;border-radius:12px;padding:13px 15px;background:#fbfcff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:#7893e8;box-shadow:0 0 0 4px rgba(71,103,216,.11)}
button{border-radius:11px;transition:transform .15s,filter .15s;cursor:pointer}
button:hover{filter:brightness(1.04)}
button:active{transform:translateY(1px)}
.actions{margin-top:20px}
.table-wrap{border:1px solid #e6ebf4;border-radius:15px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:#f6f8fd}
th{font-size:12px;color:#697895;letter-spacing:.025em;text-transform:uppercase}
th,td{padding:16px 14px;text-align:left;vertical-align:middle}
tbody tr{border-top:1px solid #edf0f7}
tbody tr:hover{background:#fafbff}
.link-cell{min-width:250px}
.link-actions{display:flex;align-items:center;gap:9px;min-width:0}
.link-actions a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:370px;color:#3559bf;text-decoration:none;font-size:13px}
.copy-link-btn{white-space:nowrap;flex-shrink:0;background:#eef2ff!important;color:#3457bf!important;border:1px solid #dce4ff!important;padding:8px 11px!important;font-size:12px!important;font-weight:750}
.copy-link-btn:hover{background:#e0e8ff!important}
.group-pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;background:#f1f4f9;color:#67748b}
.group-pill.group-a{background:#eaf1ff;color:#2861c4}
.group-pill.group-b{background:#f2eaff;color:#8548b5}
.slug-text{font-weight:800;color:#253657}
.table-buttons{white-space:nowrap}
.table-buttons button+button{margin-left:6px}
@media(max-width:700px){.shell.wide{padding:12px;margin:12px auto}.card{padding:18px;border-radius:17px}.top{padding:8px 6px}.two{grid-template-columns:1fr}th,td{padding:12px 10px}.link-actions a{max-width:180px}}

  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./admin.js"></script>
</head>
<body>
  <main class="shell wide">
    <header class="top">
      <div><div class="eyebrow">ADMIN CONSOLE</div><h1>จัดการ URL Switcher</h1></div>
      <a href="./index.html">หน้าแรก</a>
    </header>

    <section class="card" id="auth-card">
      <h2>เข้าสู่ระบบผู้ดูแล</h2>
      <p class="muted">ใช้บัญชีผู้ดูแลที่สร้างไว้ใน Supabase เท่านั้น</p>
      <form id="login-form">
        <label>อีเมล<input id="email" type="email" autocomplete="username" required></label>
        <label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>

    <section id="app" hidden>
      <div class="toolbar">
        <p id="whoami" class="muted"></p>
        <button id="logout" class="secondary">ออกจากระบบ</button>
      </div>
      <section class="card">
        <h2 id="form-title">เพิ่มลิงก์ใหม่</h2>
        <form id="link-form">
          <input id="row-id" type="hidden">
          <label>Slug (ภาษาอังกฤษ ตัวเลข และขีดกลาง)
            <input id="slug" pattern="[a-zA-Z0-9-]{2,60}" placeholder="campaign-a" required>
          </label>
          <div class="two">
            <label>ปลายทาง A (HTTPS URL)
              <input id="url-a" type="url" placeholder="https://example.com/page-a" required>
            </label>
            <label>ปลายทาง B (HTTPS URL)
              <input id="url-b" type="url" placeholder="https://example.com/page-b" required>
            </label>
          </div>
          <label>ปลายทางที่ใช้งาน
            <select id="active-target"><option value="A">A</option><option value="B">B</option></select>
          </label>
          <label>กลุ่ม Analytics ของ Slug นี้ (ไม่เกี่ยวกับปลายทาง A/B)
            <select id="pixel-group"><option value="">ไม่ระบุ (Direct)</option><option value="a">Pixel A</option><option value="b">Pixel B</option></select>
          </label>
          <div class="actions">
            <button type="submit">บันทึก</button>
            <button type="button" id="reset" class="secondary">ล้างฟอร์ม</button>
          </div>
        </form>
        <p id="message" role="status"></p>
      </section>

      <section class="card">
        <h2>ลิงก์ทั้งหมด</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Slug</th><th>ใช้งาน</th><th>กลุ่ม Analytics</th><th>ลิงก์กลาง</th><th>จัดการ</th></tr></thead>
            <tbody id="links-body"><tr><td colspan="5">กำลังโหลด…</td></tr></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
